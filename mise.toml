[tools]
go = "1.27.2"
python = "3.15.0"  # pico/tools/capture.py
uv = "0.12.9"  # OpenVINO's SDK and model conversion

[vars]
whisper = "{{config_root}}/whisper.cpp"
dist = "{{config_root}}/dist"
# OpenVINO's PyPI wheel carries its C++ SDK too, so the build and the model conversion share one version
openvino = "2026.4.1"
# In the build, so it goes with the configure stamp that points CMake at it
openvino_sdk = "{{vars.whisper}}/build/openvino-{{vars.openvino}}"

[env]
# whisper.cpp backend: cuda, vulkan, metal, or cpu.
# In [env] rather than [vars], so mise.local.toml can set it; vars can't see [env].
WHISPER_GPU = "{% if env.WHISPER_GPU %}{{ env.WHISPER_GPU }}{% elif os() == 'macos' %}metal{% else %}cuda{% endif %}"
# Headers and libs both come from the staged dist/ copy.
# Linux: --disable-new-dtags makes $ORIGIN/lib an RPATH, which also covers the libs' own dependencies.
# macOS (untested): Apple's linker has neither flag, and @loader_path is its $ORIGIN.
# The absolute rpath is for go test, whose binary sits in a temp dir; SIP strips DYLD_LIBRARY_PATH from tasks.
CGO_CFLAGS = "-I{{vars.dist}}/include"
CGO_LDFLAGS = "-L{{vars.dist}}/lib -lwhisper -lggml -lggml-base -lggml-cpu {% if os() == 'macos' %}-Wl,-rpath,@loader_path/lib -Wl,-rpath,{{vars.dist}}/lib{% else %}-Wl,-rpath-link,{{vars.dist}}/lib -Wl,-rpath,$$ORIGIN/lib -Wl,--disable-new-dtags{% endif %}"
LD_LIBRARY_PATH = "{{vars.dist}}/lib{% if env.LD_LIBRARY_PATH %}:{{env.LD_LIBRARY_PATH}}{% endif %}"
# Local runs record into the corpus; the installed service and dist/ copies are off unless set.
# An existing value wins: point worktrees at one shared file, or set it empty to turn recording off.
CORPUS_DB = "{{env.CORPUS_DB | default(value=env.XDG_DATA_HOME | default(value=env.HOME ~ '/.local/share') ~ '/pi-voice-keyboard/corpus.db')}}"

[tasks."whisper:init"]
description = "Check out the whisper.cpp submodule if it is empty"
# Only when empty, so a submodule checkout being bumped is not reset
run = "[ -e {{vars.whisper}}/.git ] || git submodule update --init {{vars.whisper}}"

[tasks."whisper:configure"]
description = "Configure whisper.cpp (WHISPER_GPU=cuda|vulkan|metal|cpu, default cuda, metal on macOS; WHISPER_OPENVINO=1)"
depends = ["whisper:init"]
run = """
case {{env.WHISPER_GPU}} in
  cuda) command -v nvcc >/dev/null || { echo 'CUDA toolkit missing: sudo apt install nvidia-cuda-toolkit' >&2; exit 1; }
        gpu=-DGGML_CUDA=ON ;;
  vulkan) command -v glslc >/dev/null && pkg-config --exists vulkan || { echo 'Vulkan SDK missing: sudo apt install libvulkan-dev glslc pkg-config' >&2; exit 1; }
        gpu=-DGGML_VULKAN=ON ;;
  # The embed option's default follows GGML_METAL, but only on first configure, so set it too
  metal) gpu='-DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON' ;;
  cpu) gpu= ;;
  *) echo 'Unknown WHISPER_GPU={{env.WHISPER_GPU}} (cuda, vulkan, metal, or cpu)' >&2; exit 1 ;;
esac
# OpenVINO runs the encoder, on top of whichever backend runs the rest.
# The wheel has no Python 3.15 build, but its SDK doesn't depend on the Python version.
ov=
if [ -n "$WHISPER_OPENVINO" ]; then
  if ! [ -d {{vars.openvino_sdk}} ]; then
    rm -rf {{vars.openvino_sdk}}.tmp  # an interrupted install, which uv would take as done
    uv pip install -q --no-deps --python-version 3.14 --target {{vars.openvino_sdk}}.tmp openvino=={{vars.openvino}}
    mv {{vars.openvino_sdk}}.tmp {{vars.openvino_sdk}}
  fi
  ov="-DWHISPER_OPENVINO=ON -DOpenVINO_DIR={{vars.openvino_sdk}}/openvino/cmake"
fi
# One stamp per backend, so switching WHISPER_GPU, WHISPER_OPENVINO or OpenVINO's version reconfigures.
# Cleared first: a failed cmake has already rewritten the cache, so the old stamp would lie.
rm -f {{vars.whisper}}/build/.configured*
# All off, then the chosen one on (the last -D wins), so switching clears the CMake cache's old choice
cmake -S {{vars.whisper}} -B {{vars.whisper}}/build -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_METAL=OFF -DWHISPER_OPENVINO=OFF $gpu $ov \
  -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
touch {{vars.whisper}}/build/.configured-{{env.WHISPER_GPU}}${WHISPER_OPENVINO:++openvino-{{vars.openvino}}}
"""
sources = ["{{vars.whisper}}/CMakeLists.txt"]
outputs = ["{{vars.whisper}}/build/.configured-{{env.WHISPER_GPU}}{% if env.WHISPER_OPENVINO %}+openvino-{{vars.openvino}}{% endif %}"]

[tasks.whisper]
description = "Build whisper.cpp (incremental)"
depends = ["whisper:configure"]
run = "n=$(getconf _NPROCESSORS_ONLN); cmake --build {{vars.whisper}}/build -j $(( n < 6 ? n : 6 )) --config Release && touch {{vars.whisper}}/build/.built"
sources = ["{{vars.whisper}}/{include,src,ggml}/**/*", "{{vars.whisper}}/build/.configured-*"]
outputs = ["{{vars.whisper}}/build/.built"]

[tasks.stage]
description = "Install whisper.cpp libraries into dist/"
depends = ["whisper"]
# Cleared first, since install never removes a previous backend's libraries.
# OpenVINO's runtime, IR reader and device plugins go along, so dist/ stays self-contained.
run = """
rm -rf {{vars.dist}}/lib {{vars.dist}}/include
cmake --install {{vars.whisper}}/build --prefix {{vars.dist}} >/dev/null
if [ -n "$WHISPER_OPENVINO" ]; then
  cd {{vars.openvino_sdk}}/openvino/libs
  cp -a libopenvino.so.* libopenvino_ir_frontend.so.* *_plugin.so libtbb*.so.* libhwloc.so.* cache.json {{vars.dist}}/lib/
fi
touch {{vars.dist}}/lib/.staged
"""
sources = ["{{vars.whisper}}/build/.built"]
outputs = ["{{vars.dist}}/lib/.staged"]  # install keeps source mtimes, so stamp it

[tasks.build]
description = "Build the transcription service into dist/"
depends = ["stage"]
dir = "{{config_root}}/transcribe-whisper"
# build is recorded with every corpus run, so results from different worktrees can be told apart.
# No sources/outputs: the stamp depends on git state, which they can't see, and Go's build cache keeps it quick.
run = """
go build -o {{vars.dist}}/transcribe-whisper \
  -ldflags "-X 'main.build=$(git describe --always --dirty) whisper.cpp:$(git -C {{vars.whisper}} describe --tags --always --dirty)' \
    -X main.backend={{env.WHISPER_GPU}}${WHISPER_OPENVINO:++openvino} -X main.buildHost=$(hostname)"
"""

[tasks.model]
description = "Download the Whisper model, and convert its encoder with WHISPER_OPENVINO (override with MODEL=...)"
depends = ["whisper:init"]
# The upstream script skips existing files, so remove a failed partial download or conversion
run = """
model=${MODEL:-medium.en}  # same default as main.go
mkdir -p speech-models
{{vars.whisper}}/models/download-ggml-model.sh $model speech-models || { rm -f speech-models/ggml-$model.bin; exit 1; }
ov=speech-models/ggml-$model-encoder-openvino
if [ -n "$WHISPER_OPENVINO" ] && ! [ -e $ov.xml ]; then
  uv run --with openvino=={{vars.openvino}} transcribe-whisper/openvino-encoder.py $model speech-models || { rm -f $ov.xml $ov.bin; exit 1; }
fi
"""

[tasks.run]
description = "Run the transcription service (override with PORT=... MODEL=...)"
depends = ["build", "model"]
run = "{{vars.dist}}/transcribe-whisper serve"

[tasks.test]
description = "Run transcribe-whisper tests"
depends = ["stage"]
dir = "{{config_root}}/transcribe-whisper"
run = "go test -count=1 ."  # the test cache can't see a backend switch in dist/lib

[tasks."pico:build"]
description = "Build Pico firmware (override with PICO_BOARD=pico2, MIC_TIMING=standard)"
dir = "{{config_root}}/pico"
run = """
command -v arm-none-eabi-gcc >/dev/null || { echo 'ARM toolchain missing: sudo apt install gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib' >&2; exit 1; }
git submodule update --init pico-sdk
git -C pico-sdk submodule update --init lib/tinyusb lib/cyw43-driver lib/lwip
# Each board gets its own build directory, since the board can't change after configuring
dir=build${PICO_BOARD:+-$PICO_BOARD}
cmake -B $dir -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ${PICO_BOARD:+-DPICO_BOARD=$PICO_BOARD} ${MIC_TIMING:+-DMIC_TIMING=$MIC_TIMING}
cmake --build $dir -j $(nproc)
"""

[tasks."pico:flash"]
description = "Build and copy firmware to the Pico, rebooting it into BOOTSEL if needed"
depends = ["pico:build"]
dir = "{{config_root}}/pico"
run = """
dev=/dev/disk/by-label/RP2350
[ -e $dev ] || stty -F /dev/ttyACM0 1200  # reboots into BOOTSEL; the RP2350 drive reappears
until [ -e $dev ]; do echo "Waiting for $dev"; sleep 1; done
# Mount it like the file manager would; fails harmlessly if the desktop already has
udisksctl mount -b $dev >/dev/null 2>&1 || true
cp build${PICO_BOARD:+-$PICO_BOARD}/voice-keyboard.uf2 "$(findmnt -no TARGET -S LABEL=RP2350)"
"""

[tasks."pico:tail"]
description = "Follow the Pico console log"
run = "stty -F /dev/ttyACM0 raw -echo && cat /dev/ttyACM0"

[tasks."pico:host-setup"]
description = "Configure this computer's end of the Pico's USB network (192.168.71.2, NetworkManager)"
run = "{{config_root}}/host/host-setup.sh"

[tasks."pico:capture"]
description = "Record from the Pico audio port and transcribe locally"
run = "pico/tools/capture.py test.wav --transcribe http://localhost:8080"
